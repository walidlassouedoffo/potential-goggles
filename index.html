<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading & Wealth Calculator</title>
<style>
  :root{
    --bg:#0B1315; --card:#131F22; --border:rgba(255,255,255,0.08);
    --gold:#E5A93B; --mint:#2ECC71; --text:#ECF0F1; --muted:#95A5A6;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{background:var(--bg);color:var(--text);padding:20px;line-height:1.5;}
  .container{max-width:500px;margin:0 auto;}
  h1{font-size:1.4rem;color:var(--gold);margin-bottom:5px;text-align:center;}
  p.sub{font-size:0.85rem;color:var(--muted);text-align:center;margin-bottom:25px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:15px;}
  .field{margin-bottom:15px;}
  label{display:block;font-size:0.8rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
  input{width:100%;padding:12px;background:#091012;border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:1rem;}
  input:focus{outline:none;border-color:var(--gold);}
  .result-box{background:#091012;border:1px solid var(--border);border-radius:10px;padding:15px;text-align:center;margin-top:20px;}
  .result-box .val{font-size:1.8rem;font-weight:bold;color:var(--mint);margin-top:5px;}
</style>
</head>
<body>

<div class="container">
  <h1>Calculateur de Croissance Trading</h1>
  <p class="sub">Simulez l'évolution de votre capital avec un pourcentage fixe par jour/mois.</p>

  <div class="card">
    <div class="field">
      <label>Capital Initial ($)</label>
      <input type="number" id="capital" value="500" oninput="calc()">
    </div>
    <div class="field">
      <label>Profit Moyen par Période (%)</label>
      <input type="number" id="profit" value="5" oninput="calc()">
    </div>
    <div class="field">
      <label>Nombre de Cycles (Mois / Semaines)</label>
      <input type="number" id="cycles" value="12" oninput="calc()">
    </div>

    <div class="result-box">
      <div style="font-size:0.75rem;color:var(--muted);text-transform:uppercase;">Capital Final Estimé</div>
      <div class="val" id="finalResult">$0</div>
    </div>
  </div>
</div>

<script>
function calc() {
  let cap = parseFloat(document.getElementById('capital').value) || 0;
  let prof = (parseFloat(document.getElementById('profit').value) || 0) / 100;
  let cycles = parseInt(document.getElementById('cycles').value) || 0;

  for(let i = 0; i < cycles; i++) {
    cap += cap * prof;
  }
  document.getElementById('finalResult').textContent = '$' + Math.round(cap).toLocaleString();
}
calc();
</script>

</body>
</html>
